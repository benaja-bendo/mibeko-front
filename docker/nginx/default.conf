# En-têtes de sécurité (P1.18) — définis via une variable de bloc `server`
# puis émis par `add_header` aux DEUX endroits nécessaires : nginx ANNULE
# l'héritage des `add_header` du bloc `server` dès qu'un bloc `location`
# en déclare un (cas de /assets/ avec son Cache-Control). D'où la répétition
# explicite plus bas — ne pas la « factoriser » en la supprimant.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # 1. Charger les types MIME par défaut de Nginx
  include /etc/nginx/mime.types;

  # 2. Forcer Nginx à reconnaître les .mjs comme du JavaScript
  types {
    application/javascript mjs;
  }

  # ── Content-Security-Policy ────────────────────────────────────────────────
  # Construite d'après l'app réelle (index.html + code) ; toute nouvelle origine
  # externe (CDN, websocket Reverb, etc.) devra être ajoutée ici explicitement.
  #
  #  default-src 'self'
  #      Par défaut, tout vient de app.mibeko.fr (bundle auto-hébergé, pas de CDN).
  #  script-src 'self' 'wasm-unsafe-eval' 'sha256-…' https://stats.mibeko.fr
  #      - 'wasm-unsafe-eval' : pdfjs-dist v6 décode les scans JBIG2/JPX du JO
  #        en WebAssembly (assets auto-hébergés sous /pdfjs-assets/).
  #      - stats.mibeko.fr : script Umami (analytics), injecté conditionnellement
  #        selon VITE_UMAMI_* au build. Inoffensif si Umami est absent — aucun
  #        script n'est alors chargé depuis cette origine.
  #      - le hash sha256 autorise UNIQUEMENT le script inline anti-flash de
  #        thème d'index.html (copié tel quel par Vite dans dist/). ⚠️ Si ce
  #        script change, recalculer :
  #        python3 -c "import hashlib,base64,re;print('sha256-'+base64.b64encode(hashlib.sha256(re.search(r'<script>(.*?)</script>',open('index.html').read(),re.S).group(1).encode()).digest()).decode())"
  #        (un hash périmé ne casse que l'anti-flash, pas l'app).
  #  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com
  #      - 'unsafe-inline' : attributs style React (zones PDF, largeurs
  #        calculées…), <style> injectés (aperçu des documents générés) et
  #        variables de thème posées par le script anti-flash.
  #      - fonts.googleapis.com : feuille de style Google Fonts (index.html).
  #  font-src 'self' https://fonts.gstatic.com data:
  #      Fichiers de polices Google Fonts ; data: en défense pour les polices
  #      embarquées par pdfjs.
  #  img-src 'self' data: blob:
  #      data:/blob: pour les rendus PDF (canvas/annotations) et icônes inline.
  #  connect-src 'self' https://api.mibeko.fr https://python.mibeko.fr https://stats.mibeko.fr
  #      API Laravel + API Python (REST, uploads ET flux SSE — les 3 lecteurs
  #      SSE passent par fetch/ReadableStream, donc par connect-src).
  #      ⚠️ À garder aligné avec VITE_LARAVEL_API_URL / VITE_PYTHON_API_URL
  #      passés au build Docker.
  #      - stats.mibeko.fr : Umami envoie les événements via fetch. Inoffensif
  #        si Umami est absent (aucune requête n'est émise vers cette origine).
  #  worker-src 'self' blob:
  #      Worker pdf.js émis par Vite comme asset même-origine ; blob: en
  #      défense pour les fallbacks de chargement de worker.
  #  frame-src 'none'      : l'app n'embarque aucune iframe.
  #  object-src 'none'     : pas de plugins (<object>/<embed>).
  #  base-uri 'self'       : neutralise l'injection de <base href>.
  #  form-action 'self'    : aucun formulaire ne poste vers un tiers
  #                          (le checkout Stripe est une redirection complète).
  #  frame-ancestors 'none': équivalent CSP de X-Frame-Options DENY.
  #  manifest-src 'self'   : manifeste éventuel servi localement.
  set $csp "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-MXjjxsyS2KMsXPZODmhi5ElAhWvT7KJ6QcZV/ms5hKk=' https://stats.mibeko.fr; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://api.mibeko.fr https://python.mibeko.fr https://stats.mibeko.fr; worker-src 'self' blob:; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; manifest-src 'self'";

  # ── En-têtes de sécurité (niveau server : toutes les réponses hors /assets/) ──
  # X-Frame-Options DENY : interdit d'afficher le dashboard dans une iframe
  # (clickjacking) — doublonne frame-ancestors pour les navigateurs anciens.
  add_header X-Frame-Options "DENY" always;
  # nosniff : le navigateur ne « devine » pas un type MIME différent de celui
  # annoncé (bloque l'exécution d'un upload servi avec un mauvais type).
  add_header X-Content-Type-Options "nosniff" always;
  # Les navigations sortantes n'exposent que l'origine (jamais le chemin, qui
  # peut contenir des identifiants de documents/dossiers).
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # HSTS : force HTTPS pendant 1 an. Le TLS est terminé par Traefik en amont ;
  # l'en-tête est simplement relayé (ignoré par les navigateurs en HTTP pur).
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  # Coupe les API sensibles du navigateur que l'app n'utilise pas.
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Content-Security-Policy $csp always;

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    # ⚠️ Répétition volontaire : le Cache-Control ci-dessus annule l'héritage
    # des add_header du bloc server (comportement nginx). Sans ces lignes, les
    # JS/CSS seraient servis sans nosniff ni CSP.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy $csp always;
  }

  location / {
    try_files $uri /index.html;
  }
}
