server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # 1. Charger les types MIME par défaut de Nginx
  include /etc/nginx/mime.types;

  # 2. Forcer Nginx à reconnaître les .mjs comme du JavaScript
  types {
    application/javascript mjs;
  }

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri /index.html;
  }
}