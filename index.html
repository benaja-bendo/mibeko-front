    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,300&family=DM+Mono:wght@400;500&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <title>Mibeko — Le droit congolais, clair et à portée de main</title>
    <script>
      // Anti-flash : réapplique le thème persisté avant le premier paint.
      // Le moteur de thèmes (src/app/themes) maintient ce cache à chaque changement.
      (function () {
        try {
          var cached = localStorage.getItem('mibeko:theme-vars');
          if (!cached) return;
          var parsed = JSON.parse(cached);
          var root = document.documentElement;
          for (var key in parsed.vars) root.style.setProperty(key, parsed.vars[key]);
          if (parsed.mode) root.style.colorScheme = parsed.mode;
        } catch (e) { /* thème par défaut du CSS */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
