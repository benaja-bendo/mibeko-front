<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=mibeko-20261004" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" href="/mibeko-icon-48.png?v=mibeko-20261004" sizes="48x48" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=mibeko-20260911" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Même href et même id que le thème par défaut (src/app/themes/mibeko-classic.ts) :
         le moteur de thèmes retrouve ce lien et ne recharge rien. Avant, cette ligne
         pointait vers les polices de Lex Gold (Fraunces, DM Mono, Instrument Sans),
         jamais utilisées par défaut, puis le moteur en ajoutait une seconde. -->
    <link id="mibeko-theme-fonts" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
    <meta name="description" content="Mibeko, votre espace de travail sur le droit congolais : textes officiels, codes et Assistant juridique, avec leur source." />
    <title>Mibeko : le droit congolais, clair et à portée de main</title>
    <script>
      // Anti-flash : réapplique le thème persisté avant le premier paint.
      // Le moteur de thèmes (src/app/themes) maintient ce cache à chaque changement.
      (function () {
        try {
          var cached = localStorage.getItem('mibeko:theme-vars');
          if (!cached) return;
          var parsed = JSON.parse(cached);
          var root = document.documentElement;
          for (var key in parsed.vars) root.style.setProperty(key, parsed.vars[key]);
          if (parsed.mode) root.style.colorScheme = parsed.mode;
        } catch (e) { /* thème par défaut du CSS */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
