name: 🚀 Deploy Production

on:
  workflow_run:
    workflows: ["✅ CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_LARAVEL_API_URL=${{ secrets.VITE_LARAVEL_API_URL }}
            VITE_PYTHON_API_URL=${{ secrets.VITE_PYTHON_API_URL }}
            VITE_UMAMI_URL=${{ secrets.VITE_UMAMI_URL }}
            VITE_UMAMI_WEBSITE_ID=${{ secrets.VITE_UMAMI_WEBSITE_ID }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Lowercase repository name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Copy deployment files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          passphrase: ${{ secrets.VPS_PASSPHRASE }}
          source: ".deploy/*"
          target: "/opt/docker/mibeko-front"
          strip_components: 1

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          passphrase: ${{ secrets.VPS_PASSPHRASE }}
          envs: REPO_LC
          script: |
            set -e
            APP_DIR="/opt/docker/mibeko-front"
            cd "$APP_DIR"

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
              -u "${{ github.actor }}" --password-stdin

            cat > .env <<EOF
            MIBEKO_FRONT_HOST=${{ secrets.MIBEKO_FRONT_HOST }}
            GITHUB_REPOSITORY=$REPO_LC
            EOF

            MAX_RETRIES=3
            RETRY_COUNT=0
            until docker compose pull; do
              RETRY_COUNT=$((RETRY_COUNT+1))
              if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
                echo "❌ Failed to pull images after $MAX_RETRIES attempts."
                exit 1
              fi
              echo "⚠️ Pull failed, retrying in 10 seconds... ($RETRY_COUNT/$MAX_RETRIES)"
              sleep 10
            done

            docker compose up -d --remove-orphans
            docker image prune -f

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3 : Nettoyage GHCR — ne garder que `latest` + les 5 derniers tags `sha-`
  # Les manifestes enfants (multi-arch / attestations) des images gardées sont
  # automatiquement préservés. La prod ne tire que `latest`, jamais les `sha-`.
  # ─────────────────────────────────────────────────────────────────────────────
  cleanup:
    name: Cleanup old GHCR images
    runs-on: ubuntu-latest
    needs: deploy
    if: success()
    continue-on-error: true
    permissions:
      packages: write
    steps:
      - name: Delete old image versions (keep latest + 5 last sha-)
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          packages: mibeko-front
          exclude-tags: latest
          keep-n-tagged: 5
          delete-untagged: true
